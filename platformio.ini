; ============================================================================
;  ESP32Home — Σύστημα θέρμανσης με LoRa (Core1121-XF / LR1121 @ 868 MHz)
; ----------------------------------------------------------------------------
;  3 περιβάλλοντα (environments):
;    levitostatio -> ESP32-S3  : ελεγκτής λεβητοστασίου (στέλνει θερμοκρασίες)
;    living_room  -> ESP32 dev : κόμβος σπιτιού + γέφυρα UART προς το CYD
;    cyd          -> CYD       : οθόνη/χειριστήριο μέσω UART (όχι LoRa)
;
;  Κάθε environment χτίζει ΜΟΝΟ τον δικό του φάκελο μέσα στο src/.
;  Build/Upload γίνονται από τα κουμπιά του PlatformIO ή με:
;     pio run -e living_room -t upload
; ============================================================================

[platformio]
; Τι χτίζεται όταν πατάς το γενικό "Build" (το CYD το χτίζουμε χωριστά προς το παρόν)
default_envs = levitostatio, living_room

; ---- Κοινές ρυθμίσεις για όλα τα boards ----
[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
    jgromes/RadioLib@^7.7.1

; ---- ESP32-S3 : Λεβητοστάσιο ----
[env:levitostatio]
board = esp32-s3-devkitc-1
build_src_filter = -<*> +<levitostatio/>
lib_deps =
    ${env.lib_deps}
    milesburton/DallasTemperature@^4.0.0
    paulstoffregen/OneWire@^2.3.8
    olikraus/U8g2@^2.35.19
; Αν το S3 board σου χρησιμοποιεί native USB (όχι ξεχωριστό UART chip) και δεν
; βλέπεις Serial monitor, ξε-σχολίασε την επόμενη γραμμή:
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1

; ---- ESP32 dev : Σπίτι ----
[env:living_room]
board = esp32dev
build_src_filter = -<*> +<living_room/>
board_build.partitions = huge_app.csv   ; χώρος για WiFi/TLS/Telegram/web
lib_deps =
    ${env.lib_deps}
    milesburton/DallasTemperature@^4.0.0
    paulstoffregen/OneWire@^2.3.8
    witnessmenow/UniversalTelegramBot@^1.3.0
    bblanchon/ArduinoJson@^6.21.5

; ---- CYD (ESP32-2432S028R) : οθόνη/χειριστήριο μέσω UART ----
[env:cyd]
board = esp32dev
build_src_filter = -<*> +<cyd/>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^6.21.5
board_build.partitions = huge_app.csv   ; χώρος για WiFi + σελίδα καιρού (HTTP/JSON)
; Ρυθμίσεις TFT_eSPI για το CYD (ILI9341, οθόνη στο HSPI ώστε να μένει ελεύθερο
; το VSPI). Έτσι δεν χρειάζεται να πειράξεις το User_Setup.h της βιβλιοθήκης.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1                ; 3.5" CYD (ESP32-3248S035) — ILI9488 480x320
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27                       ; backlight του 3.5" είναι στο GPIO27 (όχι 21)
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D TOUCH_CS=33                     ; XPT2046 στο ΙΔΙΟ SPI με την οθόνη (shared)
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=20000000          ; ILI9488 — 20 MHz (όπως στη δική σου config)
    -D SPI_TOUCH_FREQUENCY=2500000
